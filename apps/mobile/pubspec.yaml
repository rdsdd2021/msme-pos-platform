name: pos_mobile
description: MSME POS Platform - Mobile Application
version: 1.0.10+11
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  sqlite3: 2.9.4
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

dependency_overrides:
  path_provider_foundation: 2.3.2

flutter:
  uses-material-design: true
